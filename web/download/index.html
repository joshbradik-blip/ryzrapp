<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get RYZR</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap { padding: 24px; }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    border-radius: 999px;
    background: #FF6B22;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p id="status">Taking you to RYZR&hellip;</p>
    <a id="fallback" class="button" href="https://apps.apple.com/app/id6767086947">Open App Store / Play Store</a>
  </div>

  <!-- Fill in the project URL + anon key (see web/tracking/ryzr-web.js). Without
       them the tracker does nothing and this page is a plain redirect. -->
  <script src="/ryzr-web.js"
    data-supabase-url=""
    data-supabase-key=""></script>
  <script>
    var IOS_URL = 'https://apps.apple.com/app/id6767086947';
    var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.ryzr.app';

    var ua = navigator.userAgent || navigator.vendor || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);

    var p = new URLSearchParams(window.location.search);
    var target = isAndroid ? ANDROID_URL : IOS_URL;

    if (isAndroid) {
      // Play carries attribution through the install in a single `referrer`
      // parameter. The UTMs have to be nested inside it and the whole string
      // URL-encoded: top-level utm_* on a Play URL is silently dropped, and
      // the install then reports as untracked with nothing to say why.
      var ref = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']
        .filter(function (k) { return p.get(k); })
        .map(function (k) { return k + '=' + encodeURIComponent(p.get(k)); })
        .join('&');
      if (ref) target += '&referrer=' + encodeURIComponent(ref);
    } else {
      // The App Store does have an equivalent: a campaign token, reported
      // under App Analytics -> Acquisition -> Campaigns. The provider token
      // (`pt`) that agencies use is optional — `ct` alone is attributed — so
      // iOS does not have to stay untracked, which an earlier note here
      // assumed it did. Untagged clicks all collapse into one "Web referrer"
      // bucket, which is why iOS acquisition currently reads as a single lump.
      //
      // Apple accepts a short token, so the campaign name is normalised and
      // capped rather than passed through: an over-long or oddly punctuated
      // value is dropped on their side, silently, exactly like the Play case.
      var ct = (p.get('utm_campaign') || p.get('utm_source') || '')
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, '')
        .slice(0, 40);
      if (ct) target += (target.indexOf('?') === -1 ? '?' : '&') + 'ct=' + encodeURIComponent(ct);
    }
    document.getElementById('fallback').href = target;

    // Log the store hand-off (no-op if the tracker isn't configured), then
    // auto-redirect. The button stays as a manual fallback if the redirect is
    // blocked (e.g. in-app browsers that suppress it).
    try { if (window.RyzrWeb) window.RyzrWeb.track('store_click', 'download_redirect'); } catch (e) {}
    window.location.replace(target);
  </script>
</body>
</html>

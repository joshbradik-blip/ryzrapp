<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get RYZR</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap { padding: 24px; }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    border-radius: 999px;
    background: #FF6B22;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p id="status">Taking you to RYZR&hellip;</p>
    <a id="fallback" class="button" href="https://apps.apple.com/app/id6767086947">Open App Store / Play Store</a>
  </div>

  <script>
    var IOS_URL = 'https://apps.apple.com/app/id6767086947';
    var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.ryzr.app';

    var ua = navigator.userAgent || navigator.vendor || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);

    var target = isAndroid ? ANDROID_URL : IOS_URL;
    document.getElementById('fallback').href = target;

    // Auto-redirect; the button stays as a manual fallback if the
    // redirect is blocked (e.g. in-app browsers that suppress it).
    window.location.replace(target);
  </script>
</body>
</html>
